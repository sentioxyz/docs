name: Deploy (production)

# Manual release: builds the chosen ref with OpenNext and deploys it to the production Worker
# `sentio-docs` (env.production in wrangler.jsonc), served at www.sentio.xyz/docs.
# The first run creates the Worker and attaches its routes.
#
# The job runs in the `production` GitHub Environment: add required reviewers there
# (Settings -> Environments) to gate releases, and optionally environment-scoped
# CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets, which take precedence over the repo ones.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit SHA to release
        type: string
        default: main
        required: true

# One production release at a time; queue instead of cancelling a deploy halfway
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://www.sentio.xyz/docs
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          # The build's gen:sdk installs scripts/sdk-docs on its own lockfile
          cache-dependency-path: |
            package-lock.json
            scripts/sdk-docs/package-lock.json

      - run: npm ci

      # The SDK Reference's static export (~3.5 min) is rebuilt only when its inputs change: the
      # files below must match EXPORT_PATHS and generatorHash() in scripts/sdk-inputs.mjs, which
      # verifies the restored export and rebuilds it on any mismatch
      - uses: actions/cache@v6
        with:
          path: .next-sdk
          key: sdk-export-production-${{ hashFiles('scripts/sdk-docs/package-lock.json', 'scripts/sdk-docs/generate.mjs', 'scripts/sdk-docs/tsconfig.*.json', 'scripts/sdk-docs/*.md', 'app/**', 'components/**', 'lib/**', 'public/**', 'patches/**', 'next.config.mjs', 'postcss.config.mjs', 'package-lock.json', 'scripts/build-sdk.mjs', 'scripts/sdk-inputs.mjs') }}

      - name: Build and deploy
        run: npm run deploy:production
        env:
          # Inlined at build time (metadataBase, OG image URLs)
          NEXT_PUBLIC_SITE_URL: https://www.sentio.xyz
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Summary
        env:
          REF: ${{ inputs.ref }}
        run: |
          {
            echo "### Released to www.sentio.xyz/docs"
            echo
            echo "- Ref: \`$REF\`"
            echo "- Commit: \`$(git rev-parse HEAD)\`"
          } >> "$GITHUB_STEP_SUMMARY"
