name: Deploy (test)

# Builds the site with OpenNext and deploys it to the test Worker `test-docs`
# (top level of wrangler.jsonc), served at website-test.sentio.xyz/docs, on every push to main.
# Production is released manually by deploy-production.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two test deploys at once; a newer push cancels the one still running
concurrency:
  group: deploy-test
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Inlined at build time (metadataBase, OG image URLs); also part of the SDK export's cache key
      NEXT_PUBLIC_SITE_URL: https://website-test.sentio.xyz
    environment:
      name: test
      url: https://website-test.sentio.xyz/docs
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          # The build's gen:sdk installs scripts/sdk-docs on its own lockfile
          cache-dependency-path: |
            package-lock.json
            scripts/sdk-docs/package-lock.json

      - run: npm ci

      # The SDK Reference's static export (~3.5 min) is rebuilt only when its inputs change:
      # scripts/sdk-inputs.mjs hashes the generator, the files the SDK build imports and its config,
      # and build-sdk.mjs checks the restored export against the same hash
      - id: sdk-inputs
        run: echo "hash=$(node scripts/sdk-inputs.mjs)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: .next-sdk
          key: sdk-export-test-${{ steps.sdk-inputs.outputs.hash }}

      - name: Build and deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
